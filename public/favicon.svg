<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Ground Line -->
  <rect x="5" y="85" width="90" height="3" rx="1.5" fill="#8B0000" />

  <!-- House Silhouette in Maroon -->
  <path 
    fill-rule="evenodd" 
    clip-rule="evenodd" 
    d="
      M10 50 V85 H35 V50 H10 Z
      M35 50 H85 V85 H35 V50 Z
    " 
    fill="#8B0000" 
  />

  <!-- Main Pitched Roof -->
  <path
    d="M25 50 L60 25 L92 53 H86 L60 31 L32 50 H25 Z"
    fill="#8B0000"
  />

  <!-- Window Cutouts in white for contrast -->
  <rect x="14" y="55" width="16" height="10" fill="#ffffff" />
  <rect x="38" y="55" width="20" height="10" fill="#ffffff" />
  <rect x="62" y="55" width="20" height="10" fill="#ffffff" />

  <!-- Right side flat canopy/carport -->
  <path
    d="M75 48 H95 V52 H91 V85 H88 V52 H75 V48 Z"
    fill="#8B0000"
  />

  <!-- Steps in center -->
  <rect x="42" y="78" width="30" height="2" fill="#ffffff" />
  <rect x="45" y="81" width="24" height="2" fill="#ffffff" />
</svg>